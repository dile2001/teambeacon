apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-adapter
  template:
    metadata:
      labels:
        app: alert-adapter
    spec:
      containers:
        - name: alert-adapter
          image: teambeacon-alert-adapter:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: TEAMS_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: teams-webhook
                  key: url
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 5
