apiVersion: apps/v1
kind: Deployment

metadata:
  name: teambeacon-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teambeacon-backend
  template:
    metadata:
      labels:
        app: teambeacon-backend
    spec:
      containers:
        - name: teambeacon-backend
          image: teambeacon-backend:v1.4
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: teambeacon-backend-config
            - secretRef:
                name: teambeacon-db-secret
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5