apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    route:
      receiver: 'teambeacon-default'
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 1m
      routes:
      - matchers:
          - severity="critical"
        receiver: 'teambeacon-critical'
    receivers:
      - name: 'teambeacon-default'
        webhook_configs:
          - url: 'http://teambeacon-backend:80/alerts'
            send_resolved: true
      - name: 'teambeacon-critical'
        webhook_configs:
          - url: 'http://teambeacon-backend:80/alerts'
            send_resolved: true