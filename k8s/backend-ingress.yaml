apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teambeacon-backend
spec:
  ingressClassName: nginx
  rules:
    - host: teambeacon.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: teambeacon-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: teambeacon-frontend
                port:
                  number: 80
