apiVersion: apps/v1
kind: Deployment
metadata:
  name: teambeacon-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teambeacon-frontend
  template:
    metadata:
      labels:
        app: teambeacon-frontend
    spec:
      containers:
        - name: frontend
          image: teambeacon-frontend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80