apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |-
    global:
      scrape_interval: 5s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yaml
    alerting:
      alertmanagers:
        - static_configs:
          - targets:
              - 'alertmanager:9093'
    scrape_configs:
      - job_name: 'teambeacon-backend'
        static_configs:
          - targets: ['teambeacon-backend:80']
        metrics_path: /api/metrics