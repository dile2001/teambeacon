global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: teambeacon-backend
    static_configs:
      - targets:
          - backend:3000
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093          